{{ define "main" }}
<article class="card prose">
  <h1>{{ .Title }}</h1>
  <p class="date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time></p>
  {{ .Content }}
  {{- with .Params.linkedin }}
  <p><a class="button" href="{{ . }}">{{ i18n "read_on_linkedin" }}</a></p>
  {{- end }}
</article>
{{ end }}
